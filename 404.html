    @font-face { font-family: 'Poppins'; src: url('assets/fonts/poppins-500-latin-ext-cs.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }

    @font-face { font-family: 'Cairo'; src: url('assets/fonts/cairo-400-latin-ext-cs.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: 'Cairo'; src: url('assets/fonts/cairo-600-latin-cs.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Cairo'; src: url('assets/fonts/cairo-600-latin-ext-cs.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
    :root {
      --muted: rgba(255,255,255,0.72);
      --line: rgba(255,255,255,0.22);
      --skew: -6deg; --box-r: 7px; --box-shape: skewX(var(--skew));
      --font-display: 'Ethnocentric','Cairo',sans-serif;
      --font-body: 'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    body { background: #000; color: #fff; font-family: var(--font-body); font-size: 16px; line-height: 1.6; min-height: 100svh; display: grid; place-items: center; align-content: safe center; padding: clamp(56px, 9vh, 72px) clamp(16px, 5vw, 22px); -webkit-font-smoothing: antialiased; }
    ::selection { background: #fff; color: #000; }
    .e404 { width: 100%; max-width: 640px; text-align: center; border: 1px solid var(--line); transform: var(--box-shape); border-radius: var(--box-r) 0 var(--box-r) 0; padding: clamp(36px, 6vw, 64px) clamp(24px, 5vw, 56px); }
    .e404-logo { height: 52px; width: auto; margin: 0 auto 26px; transform: skewX(calc(var(--skew) * -1)); }
    .e404-label { font-size: 12px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 16px; }
    .e404-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5.4vw, 52px); line-height: 1.15; letter-spacing: 0.01em; margin-bottom: 18px; }
    .e404-text { font-size: clamp(15px, 0.4vw + 13.7px, 16px); line-height: 1.7; color: var(--muted); max-width: 46ch; margin: 0 auto clamp(26px, 4vh, 34px); }
    .e404-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px clamp(20px, 3.4vw, 34px); max-width: 100%; font-family: var(--font-body); font-size: 13px; line-height: 1; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid #fff; background: #fff; color: #000; text-decoration: none; transform: none; border-radius: var(--box-r) 0 var(--box-r) 0; transition: background 0.25s, color 0.25s, border-color 0.25s; }
    .btn span { transition: transform 0.25s; }
    .btn:hover span { transform: translateX(4px); }
    .btn:hover { background: transparent; color: #fff; }

    /* ---------- Responsive ----------
       The card is fluid by default (clamp padding + a 640px ceiling); these
       blocks only shrink the shear so the tilted corners stay inside the
       gutter on a narrow phone, and relax the vertical centring on short
       screens so nothing is ever cut off above the fold. */
    @media (max-width: 600px) {
      :root { --skew: -4deg; }
    }
    @media (max-width: 400px) {
      :root { --skew: -3deg; }
      .btn { padding: 15px 18px; font-size: 12px; letter-spacing: 0.1em; }
    }
    /* short screens (phone held sideways): shrink the stack so the whole
       card, button included, fits above the fold */
    @media (max-height: 560px) {
      body { padding-block: clamp(20px, 6vh, 34px); }
      .e404 { padding-block: clamp(22px, 5vh, 34px); }
      .e404-logo { height: 38px; margin-bottom: 16px; }
      .e404-label { margin-bottom: 10px; letter-spacing: 0.3em; }
      .e404-title { font-size: clamp(24px, 4.2vw, 34px); margin-bottom: 12px; }
      .e404-text { margin-bottom: 20px; }
      .btn { padding-block: 14px; }
    }


    /* ---------- S&F Digital credit ---------- */
    .sf-credit { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; font-family: 'Poppins', var(--font-body); font-size: 8px; font-weight: 400; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff; white-space: nowrap; opacity: 0.2; }
    .sf-credit-logo { height: 13px; width: auto; filter: invert(1); }

  <main class="e404">

    <h1 class="e404-title">Stránka nenalezena</h1>
    <p class="e404-text">Omlouváme se — tato stránka neexistuje nebo byla přesunuta. Vraťte se zpět a objevte více.</p>
    <div class="e404-actions">
      <a class="btn" href="index.html">Zpět na úvod <span aria-hidden="true">→</span></a>
      <a class="btn" href="horni-briza.html">Navštívit myčku <span aria-hidden="true">→</span></a>
    </div>
  </main>
  <span class="sf-credit">
    <span>Designed by</span>
    <img src="assets/images/SFDigital.svg" alt="S&amp;F Digital" class="sf-credit-logo" width="1635" height="684" loading="lazy" />
  </span>
