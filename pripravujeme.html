    * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
    :root {
      --black: #000000; --white: #ffffff;
      --muted: rgba(255,255,255,0.72);
      --line: rgba(255,255,255,0.22);
      --skew: -6deg; --box-r: 7px; --box-shape: skewX(var(--skew));
      --font-display: 'Ethnocentric','Cairo',sans-serif;
      --font-body: 'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    html { background: #000000; scrollbar-color: #e8e8e8 #ffffff; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #ffffff; }
    ::-webkit-scrollbar-thumb { background: #e8e8e8; border: 2px solid #ffffff; }
    ::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
    body { background: #000; color: #fff; font-family: var(--font-body); font-size: 16px; line-height: 1.6; min-height: 100svh; -webkit-font-smoothing: antialiased; }
    ::selection { background: #fff; color: #000; }
    .fx-enter-wipe { position: fixed; top: -12%; bottom: -12%; left: -8%; width: 130%; background: #fff; z-index: 200; transform: translateX(-120%) skewX(-12deg); pointer-events: none; }
    .fx-enter-wipe.is-cover { transform: translateX(0) skewX(-12deg); }
    .fx-enter-wipe.is-reveal { transform: translateX(120%) skewX(-12deg); transition: transform 0.65s cubic-bezier(0.76,0,0.24,1); }
    @media (prefers-reduced-motion: reduce) { .fx-enter-wipe { display: none; } }
    .ph { position: relative; isolation: isolate; min-height: 100svh; display: grid; place-items: center; align-content: safe center; padding: clamp(64px, 12vh, 88px) clamp(16px, 5vw, 22px) clamp(56px, 8vh, 72px); overflow: hidden; background: #000; }
    .ph::before { content: ""; position: absolute; inset: 0; z-index: -2; background: url('assets/images/soon.jpg') center / cover no-repeat; }
    .ph::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0.58) 45%, rgba(0,0,0,0.72)); }
    .ph-card { width: 100%; max-width: 640px; text-align: center; border: 1px solid rgba(255,255,255,0.16); background: var(--black); transform: var(--box-shape); border-radius: var(--box-r) 0 var(--box-r) 0; padding: clamp(36px, 6vw, 64px) clamp(24px, 5vw, 56px); opacity: 0; translate: 0 26px; transition: opacity 0.7s ease, translate 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    .ph-card.is-visible { opacity: 1; translate: 0 0; }
    .ph-logo { height: 52px; width: auto; margin: 0 auto 26px; transform: skewX(calc(var(--skew) * -1)); }
    .ph-label { font-size: 12px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 16px; }
    .ph-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5.4vw, 52px); line-height: 1.15; letter-spacing: 0.01em; margin-bottom: 18px; }
    .ph-text { font-size: clamp(15px, 0.4vw + 13.7px, 16px); line-height: 1.7; color: var(--muted); max-width: 46ch; margin: 0 auto clamp(26px, 4vh, 34px); }
    .ph-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px clamp(20px, 3.4vw, 34px); max-width: 100%; font-family: var(--font-body); font-size: 13px; line-height: 1; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid transparent; text-decoration: none; cursor: pointer; transform: none; border-radius: var(--box-r) 0 var(--box-r) 0; transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
    .btn span { transition: transform 0.25s; }
    .btn:hover span { transform: translateX(4px); }
    .btn-white { background: #fff; border-color: #fff; color: #000; }
    .btn-white:hover { background: transparent; border-color: #fff; color: #fff; }
    .btn-ghost { background: transparent; border-color: #fff; color: #fff; }
    .btn-ghost:hover { background: #fff; border-color: #fff; color: #000; }
    @media (prefers-reduced-motion: reduce) { .ph-card { opacity: 1; translate: 0 0; transition: none; } }

    /* ---------- Responsive ----------
       The card is fluid by default (clamp padding + a 640px ceiling); these
       blocks only shrink the shear so the tilted corners stay inside the
       gutter on a narrow phone, and relax the vertical centring on short
       screens so nothing is ever cut off above the fold. */
    @media (max-width: 600px) {
      :root { --skew: -4deg; }
    }
    @media (max-width: 400px) {
      :root { --skew: -3deg; }
      .btn { padding: 15px 18px; font-size: 12px; letter-spacing: 0.1em; }
    }
    /* short screens (phone held sideways): shrink the stack so the whole
       card, buttons included, fits above the fold */
    @media (max-height: 560px) {
      .ph { padding-block: clamp(20px, 6vh, 34px); }
      .ph-card { padding-block: clamp(22px, 5vh, 34px); }
      .ph-logo { height: 38px; margin-bottom: 16px; }
      .ph-label { margin-bottom: 10px; letter-spacing: 0.3em; }
      .ph-title { font-size: clamp(24px, 4.2vw, 34px); margin-bottom: 12px; }
      .ph-text { margin-bottom: 20px; }
      .btn { padding-block: 14px; }
    }


    /* ---------- S&F Digital credit ---------- */
    .sf-credit { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; display: inline-flex; align-items: center; gap: 6px; font-family: 'Poppins', var(--font-body); font-size: 8px; font-weight: 400; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff; white-space: nowrap; opacity: 0.2; }
    .sf-credit-logo { height: 13px; width: auto; filter: invert(1); }

        <a class="btn btn-white" href="index.html">Zpět na úvod <span aria-hidden="true">→</span></a>

  <span class="sf-credit">
    <span>Designed by</span>
    <img src="assets/images/SFDigital.svg" alt="S&amp;F Digital" class="sf-credit-logo" width="1635" height="684" loading="lazy" />
  </span>
  <script>
    (function () {
      var card = document.getElementById('ph-card');
      if (card) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { card.classList.add('is-visible'); });
        });
      }
      try {
        if (sessionStorage.getItem('fx-enter-wipe') === '1') {
          sessionStorage.removeItem('fx-enter-wipe');
          var wipe = document.createElement('div');
          wipe.className = 'fx-enter-wipe is-cover';
          wipe.setAttribute('aria-hidden', 'true');
          document.body.appendChild(wipe);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              wipe.classList.add('is-reveal');
              setTimeout(function () { wipe.remove(); }, 800);
            });
          });
          setTimeout(function () { if (wipe.parentNode) wipe.remove(); }, 2500);
        }
      } catch (err) {}
    })();
  </script>
